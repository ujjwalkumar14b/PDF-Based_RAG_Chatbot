<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PDF-Based RAG Chatbot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
      .chat-log {
        min-height: 22rem;
        max-height: 60vh;
        overflow-y: auto;
      }
      .chat-message {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      p{
        padding-top: 1rem;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="text-center">
        <h1 class="mt-3">PDF-Based RAG Chatbot</h1>
        <p>Upload PDFs and ask questions about their content.</p>
      </div>
      

      <div class="row g-4">
        <section class="col-lg-3" aria-labelledby="documents-heading">
          <div class="card border">
            <div class="card-body">
              <h2>Documents</h2>
              <form id="upload-form">
                <label for="pdf-files" class="form-label">Choose PDF files</label>
                <input id="pdf-files" class="form-control mb-3" type="file" name="pdfs" accept="application/pdf,.pdf" multiple required>
                <button id="upload-button" class="btn btn-dark w-100" type="submit">Process documents</button>
              </form>
              <p id="upload-status" role="status" aria-live="polite">No documents processed yet.</p>
            </div>
          </div>
        </section>

        <section class="col-lg-9" aria-labelledby="chat-heading">
          <div class="card border">
            <div class="card-body">
              <h2 id="chat-heading" class="h5">Ask a question</h2>
              <div id="chat-log" class="chat-log" aria-live="polite">
                <p>Your conversation will appear here.</p>
              </div>
              
              <form id="chat-form">
                <label for="question" class="visually-hidden">Your question</label>
                <div class="input-group">
                  <input id="question" class="form-control" type="text" placeholder="Ask a question about your documents..." required></input>
                  <button id="send-button" class="btn btn-dark px-4" type="submit">Send</button>
                </div>
              </form>
              <p id="chat-status" role="status" aria-live="polite"></p>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script>
      const uploadForm = document.querySelector("#upload-form");
      const uploadButton = document.querySelector("#upload-button");
      const uploadStatus = document.querySelector("#upload-status");
      const fileInput = document.querySelector("#pdf-files");
      const chatForm = document.querySelector("#chat-form");
      const questionInput = document.querySelector("#question");
      const sendButton = document.querySelector("#send-button");
      const chatLog = document.querySelector("#chat-log");
      const chatStatus = document.querySelector("#chat-status");

      async function readResponse(response) {
        const result = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(result.error || "The request could not be completed.");
        }
        return result;
      }

      function addMessage(role, content) {
        if (chatLog.querySelector(".text-secondary")) {
          chatLog.replaceChildren();
        }

        const message = document.createElement("div");
        message.className = "chat-message mb-3";

        const label = document.createElement("div");
        label.className = "small fw-semibold text-secondary mb-1";
        label.textContent = role;

        const body = document.createElement("div");
        body.textContent = content;

        message.append(label, body);
        chatLog.append(message);
        chatLog.scrollTop = chatLog.scrollHeight;
      }

      uploadForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!fileInput.files.length) {
          uploadStatus.textContent = "Choose at least one PDF file.";
          uploadStatus.className = "small mt-3 mb-0 text-danger";
          return;
        }

        uploadButton.disabled = true;
        uploadStatus.textContent = "Processing documents...";
        uploadStatus.className = "small mt-3 mb-0 text-secondary";

        const formData = new FormData();
        for (const file of fileInput.files) {
          formData.append("pdfs", file);
        }

        try {
          const response = await fetch("/upload", { method: "POST", body: formData });
          const result = await readResponse(response);
          uploadStatus.textContent = result.message;
          uploadStatus.className = "small mt-3 mb-0 text-success";
          chatLog.replaceChildren();
          const emptyMessage = document.createElement("p");
          emptyMessage.className = "text-secondary mb-0";
          emptyMessage.textContent = "Documents are ready. Ask a question to get started.";
          chatLog.append(emptyMessage);
          chatStatus.textContent = "";
        } catch (error) {
          uploadStatus.textContent = error.message;
          uploadStatus.className = "small mt-3 mb-0 text-danger";
        } finally {
          uploadButton.disabled = false;
        }
      });

      chatForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const question = questionInput.value.trim();
        if (!question) {
          return;
        }

        addMessage("You", question);
        questionInput.value = "";
        sendButton.disabled = true;
        chatStatus.textContent = "Thinking...";
        chatStatus.className = "small text-secondary mt-2 mb-0";

        try {
          const response = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question }),
          });
          const result = await readResponse(response);
          addMessage("Assistant", result.answer);
          chatStatus.textContent = "";
        } catch (error) {
          chatStatus.textContent = error.message;
          chatStatus.className = "small text-danger mt-2 mb-0";
        } finally {
          sendButton.disabled = false;
          questionInput.focus();
        }
      });
    </script>
  </body>
</html>
